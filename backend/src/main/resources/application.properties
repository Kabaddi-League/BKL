spring.application.name=bkl-backend

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:h2:mem:bkldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=KEY,VALUE,USERS}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA Settings
spring.jpa.database-platform=${DB_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.generate-ddl=true
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Multipart File Upload Limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Server Port
server.port=${PORT:8080}

# JWT Configuration
bkl.jwt.secret=${JWT_SECRET:BKL_BACCHHA_KABADDI_LEAGUE_SUPER_SECRET_KEY_2026_PRODUCTION_QUALITY_SECURE_TOKEN_STRING}
bkl.jwt.expiration-ms=86400000

# Supabase Storage Configuration
supabase.url=${SUPABASE_URL:}
supabase.key=${SUPABASE_KEY:}
supabase.bucket=${SUPABASE_BUCKET:profile-images}

# Logging
logging.level.com.bkl.auction=INFO
